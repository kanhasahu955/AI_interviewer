# Hostinger VPS — Snowflake + Redis + API + workers + Nginx (no MySQL container)
# Usage: cd backend && docker compose -f docker-compose.hostinger.yml up -d --build

name: interviewer-ai

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Build the image once here; worker + livekit-agent reuse interviewer-ai:latest.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: interviewer-ai:latest
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - app_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: interviewer-ai:latest
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - app_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  livekit-agent:
    image: interviewer-ai:latest
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["python", "-m", "app.livekit_agent.worker", "start"]
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/hostinger/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
      - ./deploy/hostinger/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  app_storage:
