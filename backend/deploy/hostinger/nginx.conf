# bakerywala.cloud — split subdomains
#   iweb.bakerywala.cloud  → React frontend
#   intapi.bakerywala.cloud → FastAPI + WebSocket
#
# DNS (Hostinger hPanel): A records for both subdomains → your VPS IP
# SSL: certbot -d iweb.bakerywala.cloud -d intapi.bakerywala.cloud

# ── Frontend ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name iweb.bakerywala.cloud;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Backend API ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name intapi.bakerywala.cloud;

    client_max_body_size 25m;

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
